# The room's stack, on one machine: Postgres, Redis, the ASGI server, the
# referee workers, and a Caddy that serves the Flutter build and proxies
# everything Django owns.
#
#   scripts\deploy-local.ps1        builds the client and brings this up
#
# Its own project name and its own volumes, so it never fights the dev
# docker-compose.yml. Caddy is the only service that publishes a port.

name: refbot-deploy

x-django: &django
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.lan
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.deploy}
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: postgres://refbot:${POSTGRES_PASSWORD:-refbot}@postgres:5432/refbot
    REDIS_URL: redis://redis:6379
    REFEREE_API_KEY: ${REFEREE_API_KEY:-}
    REFEREE_MODEL: ${REFEREE_MODEL:-gemini-3.5-flash-lite}
    REFEREE_BASE_URL: ${REFEREE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
  volumes:
    - staticfiles:/app/staticfiles
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refbot
      POSTGRES_USER: refbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refbot}
    # Four web workers hold a connection per executor thread. 200 is well clear
    # of that and of the referee workers beside them.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refbot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Nothing here outlives the event: the channel layer is pub/sub, the cache
    # is a cache, and a queued referee job is worth less than a fast restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "10000"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Runs to completion before the server starts, so no two workers race the
  # same migration.
  migrate:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    restart: "no"

  backend:
    <<: *django
    command:
      - uvicorn
      - config.asgi:application
      - --host=0.0.0.0
      - --port=8000
      - --workers=4
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # A referee job is one call to Gemini and then a broadcast: mostly waiting, so
  # two processes cover a room's worth of debates finishing at once.
  worker:
    <<: *django
    command: ["python", "manage.py", "rqworker", "referee"]
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app/build/web:/srv/web:ro
      - staticfiles:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
