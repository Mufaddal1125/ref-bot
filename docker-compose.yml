name: refbot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refbot
      POSTGRES_USER: refbot
      POSTGRES_PASSWORD: refbot
    # Off the default port on purpose: plenty of laptops already run something on 5432.
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refbot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
